<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logs</title>
  <link rel="stylesheet" href="log-styles.css" />
</head>
<body>
  <div id="log-app">
    <header class="log-header">
      <span id="log-title" class="log-title">Logs</span>
      <button id="clear-btn" class="log-btn">Clear</button>
    </header>
    <pre id="log-output" class="log-output"></pre>
    <div id="log-status" class="log-status">connecting…</div>
  </div>
  <script src="logs.js"></script>
</body>
</html>
